[package]
name = "rustmistmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
getrandom = "0.4"
hex.workspace = true
rmcp.workspace = true
rustls.workspace = true
rustix = { version = "1", features = ["process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
rustmistmcp-core = { version = "0.4.0", path = "../rustmistmcp-core" }
mecmcp-audit.workspace = true
mecmcp-auth.workspace = true
mecmcp-changeset.workspace = true
mecmcp-http.workspace = true
mecmcp-job.workspace = true
mecmcp-redact.workspace = true
mecmcp-runtime.workspace = true
mecmcp-secret.workspace = true
mecmcp-server.workspace = true
mecmcp-transport.workspace = true

[dev-dependencies]
async-trait.workspace = true
http.workspace = true
mecmcp-audit = { workspace = true, features = ["test-util"] }
# Test-only: tests/http_client_wiring.rs uses HttpMistClient::from_test_parts.
rustmistmcp-core = { version = "0.4.0", path = "../rustmistmcp-core", features = ["test-util"] }
# Test-only: runtime_contract.rs and http_client_wiring.rs use
# mecmcp_transport::test_harness::serve_on_loopback. mecmcp 0.24.0 (#387)
# moved test_harness and test_client behind this feature and dropped their
# `ureq` dependency from the normal (non-test-util) dependency graph.
mecmcp-transport = { workspace = true, features = ["test-util"] }
reqwest.workspace = true
rmcp = { workspace = true, features = ["client"] }
tempfile = "3"
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true
