[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # chrono is unmaintained (no fix exists). It is required non-optionally by rmcp, oauth2 and mecmcp; revisit when rmcp drops it.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by rmcp/oauth2, no maintained replacement upstream" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/mechubsec/mecmcp"]
