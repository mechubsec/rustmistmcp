name: Sign release tarball

# The `archive` job in release.yml already builds a deterministic,
# attested tarball at tag-push time (in-toto provenance via
# actions/attest-build-provenance), but only uploads it as a 90-day CI
# artifact -- nothing ever reaches the actual GitHub release. This
# workflow closes that gap and signs what it finds.
#
# Triggered on `release: published`, not the tag push itself: the release
# and its asset list do not exist at tag-push time, and a release is only
# published by the board user, so this never fires from a PR, a branch
# push, or an unreviewed tag.
#
# This downloads the exact tarball `archive` already built and attested,
# rather than rebuilding it here: rebuilding would produce a second set of
# bytes that the existing attestation does not cover. Reusing the
# tag-push artifact keeps the uploaded release asset identical to what was
# attested.
on:
  release:
    types: [published]

jobs:
  fetch-archive:
    name: Fetch tag-push archive artifact
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    timeout-minutes: 10
    steps:
      - name: Locate release.yml run for this tag
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$REPO" --workflow release.yml --branch "$TAG" \
            --status success --json databaseId --jq '.[0].databaseId')
          [[ -n $run_id && $run_id != "null" ]] || {
            echo "no successful release.yml run found for tag $TAG" >&2
            exit 1
          }
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download archive artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh run download "${{ steps.run.outputs.id }}" --repo "$REPO" --name rustmistmcp-archive --dir dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1
          if-no-files-found: error

  upload-tarball:
    name: Attach tarball to release
    needs: fetch-archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release upload
    timeout-minutes: 10
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Upload tarball to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        # --clobber: a re-run after a partial failure must be able to
        # re-upload without deleting the assets by hand first.
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --repo "${{ github.repository }}" --clobber

  sign:
    needs: upload-tarball
    permissions:
      contents: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-sign-release-tarball.yml@b529190df5b2f1caa0fe1dd16ef29dbc74c3c51e # v0.26.1
